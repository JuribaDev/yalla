name: Dependency Review

# Runs on every pull request and fails the build when a new dependency
# introduces a known vulnerability or a disallowed license. This is the
# gate that backs the "dependency review expectations for new third-party
# packages" acceptance criterion in US-0011 — pair it with CONTRIBUTING.md's
# dependency-review checklist before adding any new module.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check dependency review support
        id: dependency-review-support
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}")"

          supported="$(REPO_JSON="${repo_json}" python3 <<'PY'
          import json
          import os

          repo = json.loads(os.environ["REPO_JSON"])
          analysis = repo.get("security_and_analysis") or {}
          dependency_graph = (analysis.get("dependency_graph") or {}).get("status")
          advanced_security = (analysis.get("advanced_security") or {}).get("status")

          supported = (
              not repo.get("private", False)
              or (dependency_graph == "enabled" and advanced_security == "enabled")
          )
          print("true" if supported else "false")
          PY
          )"

          echo "supported=${supported}" >> "${GITHUB_OUTPUT}"
          if [[ "${supported}" != "true" ]]; then
            echo "::notice::Skipping dependency-review-action because this private repository does not expose GitHub Dependency Review. Enable Dependency graph and GitHub Advanced Security to enforce this gate."
          fi

      # This is a required security gate. Private repositories must enable
      # GitHub Dependency graph / Dependency review before branch protection
      # marks this workflow required.
      - name: Dependency Review
        if: steps.dependency-review-support.outputs.supported == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Permissive open-source list. Yalla itself is MIT-licensed; we
          # accept the common OSI-approved licenses that are compatible
          # with redistribution as part of a release archive.
          allow-licenses: >-
            MIT,
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            MPL-2.0,
            CC0-1.0,
            Unlicense,
            0BSD
