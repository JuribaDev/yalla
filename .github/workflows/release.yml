name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=homebrew,scoop,winget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload public release artifacts to RustFS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RUSTFS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RUSTFS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
          RUSTFS_BUCKET: yalla-releases
          RUSTFS_ENDPOINT: https://s3.jsa.sa
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?RUSTFS_ACCESS_KEY_ID secret is required}"
          : "${AWS_SECRET_ACCESS_KEY:?RUSTFS_SECRET_ACCESS_KEY secret is required}"
          aws --version
          aws configure set default.s3.addressing_style path
          aws s3 cp dist/ "s3://${RUSTFS_BUCKET}/releases/download/${GITHUB_REF_NAME}/" \
            --recursive \
            --exclude "*" \
            --include "*.tar.gz" \
            --include "*.zip" \
            --include "*checksums.txt" \
            --endpoint-url "${RUSTFS_ENDPOINT}"

  npm-publish:
    name: Publish npm wrapper
    runs-on: ubuntu-latest
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Stamp wrapper version
        working-directory: npm
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          export VERSION="${TAG#v}"
          node -e "const f='./package.json';const p=require(f);p.version=process.env.VERSION;require('fs').writeFileSync(f, JSON.stringify(p, null, 2)+'\n');"

      - name: Publish
        working-directory: npm
        run: npm publish --access public
