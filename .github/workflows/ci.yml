name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        if: runner.os != 'Windows'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Tidy modules
        run: go mod tidy

      - name: Static check (go vet)
        run: go vet ./...

      - name: Unit and integration tests
        run: go test ./...

      - name: Repository integration tests
        run: go test ./internal/controlplane/store/...

      - name: HTTP handler contract tests
        run: go test ./internal/controlplane/httpapi/...

      - name: OpenAPI schema conformance tests
        run: go test ./internal/controlplane/openapi/...

      - name: Policy matrix tests
        run: go test -run TestPolicyMatrix ./...

      - name: Quota concurrency tests
        run: go test -run TestQuotaConcurrency ./...

      - name: Job worker lease tests
        run: go test -run TestJobWorkerLease ./...

      - name: Fake Dokploy contract tests
        run: go test -run TestFakeDokploy ./...

      - name: Redaction tests
        run: go test -run TestRedaction ./...

      - name: Fuzz validator tests
        run: go test -run TestFuzzValidator ./...

      - name: Migration tests from empty DB
        run: go test -run TestMigrationsEmptyDB ./...

      - name: Migration downgrade safety tests
        run: go test -run TestMigrationsDowngradeSafety ./...

      - name: Load smoke tests
        run: go test -run TestLoadSmoke ./...

      - name: Chaos tests for Dokploy timeouts
        run: go test -run TestChaosDokployTimeouts ./...

      - name: Chaos tests for Postgres disconnects
        run: go test -run TestChaosPostgresDisconnects ./...

      - name: Idempotency replay tests
        run: go test -run TestIdempotencyReplay ./...

      - name: Audit completeness tests
        run: go test -run TestAuditCompleteness ./...

      - name: Pagination stability tests
        run: go test -run TestPaginationStability ./...

      - name: Tenant isolation tests
        run: go test -run TestTenantIsolation ./...

      - name: Backup restore rehearsal tests
        run: go test -run TestBackupRestoreRehearsal ./...

      - name: Release build tests
        run: go test -run TestReleaseBuild ./...

      - name: Config validation tests
        run: go test -run TestConfigValidation ./...

      - name: Admin endpoint tests
        run: go test -run TestAdminEndpoint ./...

      - name: Break-glass tests
        run: go test -run TestBreakGlass ./...

      - name: Reconciliation tests
        run: go test -run TestReconciliation ./...

      - name: Import dry-run tests
        run: go test -run TestImportDryRun ./...

      - name: Service desired-state golden tests
        run: go test -run TestServiceDesiredState ./...

      - name: Deployment lifecycle end-to-end tests
        run: go test -run TestDeploymentLifecycleE2E ./...

      - name: Kubernetes artifact static tests
        run: go test ./internal/release/... -run TestKubernetesArtifact

      - name: systemd artifact static tests
        run: go test ./internal/release/... -run TestSystemdArtifact

      - name: Database migration command artifact static tests
        run: go test ./internal/release/... -run TestDatabaseMigrationCommand

      - name: Database migration authoring artifact static tests
        run: go test ./internal/release/... -run TestDatabaseMigrationAuthoringArtifact

      - name: Worker job authoring artifact static tests
        run: go test ./internal/release/... -run TestWorkerJobAuthoringArtifact

      - name: Fake Dokploy usage artifact static tests
        run: go test ./internal/release/... -run TestFakeDokployUsageArtifact

      - name: Seed admin command artifact static tests
        run: go test ./internal/release/... -run TestSeedAdminCommand

      - name: Backup command artifact static tests
        run: go test ./internal/release/... -run TestBackupCommand

      - name: Restore rehearsal command artifact static tests
        run: go test ./internal/release/... -run TestRestoreRehearsalCommand

      - name: Config example artifact static tests
        run: go test ./internal/release/... -run TestConfigExamplesArtifact

      - name: Deployment runbook artifact static tests
        run: go test ./internal/release/... -run TestDeploymentRunbookArtifact

      - name: Local development setup artifact static tests
        run: go test ./internal/release/... -run TestLocalDevelopmentSetupArtifact

      - name: API handler conventions artifact static tests
        run: go test ./internal/release/... -run TestAPIHandlerConventionsArtifact

      - name: Policy engine conventions artifact static tests
        run: go test ./internal/release/... -run TestPolicyEngineConventionsArtifact

      - name: Quota implementation guide artifact static tests
        run: go test ./internal/release/... -run TestQuotaImplementationGuideArtifact

      - name: Repository conventions artifact static tests
        run: go test ./internal/release/... -run TestRepositoryConventionsArtifact

      - name: Incident response runbook artifact static tests
        run: go test ./internal/release/... -run TestIncidentResponseRunbookArtifact

      - name: On-call dashboard artifact static tests
        run: go test ./internal/release/... -run TestOnCallDashboardArtifact

      - name: SLO document artifact static tests
        run: go test ./internal/release/... -run TestSLODocumentArtifact

      - name: Release checklist artifact static tests
        run: go test ./internal/release/... -run TestReleaseChecklistArtifact

      - name: Rollback checklist artifact static tests
        run: go test ./internal/release/... -run TestRollbackChecklistArtifact

      - name: Race detector
        run: go test -race ./...

  # Security gate (US-0011). govulncheck always runs — vulnerability scans
  # are non-negotiable before merge. staticcheck and golangci-lint also run
  # because the repo ships a configured `.golangci.yml`; if either lint
  # surfaces a finding the build fails.
  security:
    name: Security and lint gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: golangci-lint
        # Pin to a v2 release: v1.x of golangci-lint is built with Go 1.24
        # and refuses to parse a module that targets a newer toolchain.
        # The action's `latest` selector resolves to the latest v1, not
        # the latest absolute release, so the version must be explicit.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  goreleaser-check:
    name: GoReleaser config check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: GoReleaser snapshot dry-run
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*_checksums.txt
          if-no-files-found: warn
          retention-days: 7
