# yalla golangci-lint configuration (v2 schema).
#
# Migrated from the v1 layout when the project moved to Go 1.26.x — the
# v1 series of golangci-lint (≤ 1.64) is built against Go 1.24 and
# refuses to parse a module that targets a newer toolchain. v2 is a
# config-format break: linters split into `linters` + `formatters`,
# `disable-all: true` becomes `default: none`, `linters-settings`
# nests under `linters.settings`, and the issue-exclusion DSL moves to
# `linters.exclusions`.
#
# Scope intent — match the *effective* behaviour of the v1 config on
# this repo. v2 enables strictly more checks by default (notably
# `govet.enable-all` includes fieldalignment in v2 but not v1, and
# `staticcheck.checks: all` includes QF quick-fix suggestions only in
# v2). We disable those new categories explicitly so the v1→v2 binary
# migration doesn't accidentally become a 100-issue refactor PR. The
# strict-mode opt-ins can be re-enabled in a follow-up cleanup pass.
#
# This file remains layered on top of the required checks (gofmt, go
# vet, go test) executed by scripts/verify.sh and the CI workflow.
# Adding or removing a linter is a public contributor-experience
# change; document the rationale in CONTRIBUTING.md when you change
# this file.

version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    # Correctness / security
    - govet            # deeper static analysis on top of `go vet`
    - staticcheck      # SA-series correctness, performance, and style
    - errcheck         # unchecked error returns
    - ineffassign      # ineffectual assignments
    - unused           # dead code
    - bodyclose        # http response bodies always closed
    - gosec            # well-known security anti-patterns
    - errorlint        # %w / errors.Is / errors.As discipline
    # Style / readability — only ones that don't fight the existing codebase
    - misspell
    - unconvert
    - revive
  settings:
    govet:
      enable-all: true
      disable:
        # fieldalignment is a pedantic memory-layout linter that fires on
        # well-shaped, agent-facing JSON structs whose field order is
        # part of the public contract. Re-enable explicitly in a perf
        # pass; not worth fighting here.
        - fieldalignment
        # shadow noise on idiomatic `if err := f(); err != nil { ... }`.
        - shadow
    staticcheck:
      # The QF-* (quick-fix) and ST-* (style) families are opt-in
      # suggestions, not correctness checks. Keep SA-* (correctness)
      # and S-* (simplification) on.
      checks:
        - all
        - -QF*
        - -ST*
    errcheck:
      check-type-assertions: true
      check-blank: false
      # Idiomatic Go patterns where the returned error is not actionable:
      # `defer X.Close()` after a successful Open/Get, and fmt.Fprint*
      # calls to stderr inside the renderer. Listing each so the
      # exclusion is explicit rather than a blanket relax.
      exclude-functions:
        - (io.Closer).Close
        - (*net/http.Response).Body.Close
        - (*os.File).Close
        - (*compress/gzip.Reader).Close
        - fmt.Fprint
        - fmt.Fprintln
        - fmt.Fprintf
    gosec:
      excludes:
        # G304 — file inclusion via variable: the CLI deliberately takes
        # user paths (--input, --config); we validate at the surface.
        - G304
        # G306 — file write permissions: the docs/manifest writer
        # emits 0o644 because the artefacts are intended for the user
        # to read (and tools that follow them, like GitHub UI).
        - G306
        # G301 — directory write permissions: the upgrade installer
        # creates a 0o755 staging directory because the binary needs
        # to be executable by the user, which requires the +x bit.
        - G301
        # G302 — file mode chmod permissions: the upgrade installer
        # writes the new binary with 0o755 because the binary needs to
        # be executable (the +x bit is non-negotiable). Restricting to
        # 0o600 would ship a binary the user cannot run.
        - G302
        # G705 — XSS via taint analysis: every offender is an
        # httptest.Server handler in a test fixture that echoes the
        # request back to verify redaction. Not a production-code
        # vector.
        - G705
        # G101 — hardcoded credentials: every offender is a `const
        # secretSentinel = "yalla-test-..."` in the redaction security
        # tests, which is the *whole point* of those tests.
        - G101
    revive:
      rules:
        - name: var-naming
        - name: exported
        - name: package-comments
        - name: receiver-naming
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: blank-imports
        - name: increment-decrement
        - name: range
        - name: superfluous-else
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
  exclusions:
    rules:
      # Test files often need long literal payloads, intentional shadowing
      # for table-driven tests, "magic" constants for golden inputs, and
      # idiomatic shortcuts (multipart.NextPart returns the documented
      # untyped io.EOF; httptest server handlers commonly skip Body.Close
      # cleanup because the server is torn down via t.Cleanup).
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - gocognit
          - lll
          - errorlint
          - bodyclose
      # Generated files (registry, schemas, manifest) carry verbatim
      # payloads that we never want to lint into oblivion.
      - path: internal/api/data/
        linters:
          - dupl
          - funlen
          - lll
          - gocyclo

# gofmt and goimports moved out of `linters` in v2 — they live under
# `formatters` so the action can run them with `--fix` independently.
formatters:
  enable:
    - gofmt
    - goimports

issues:
  # Don't hide already-fixed findings: every report should be actionable.
  max-issues-per-linter: 0
  max-same-issues: 0
