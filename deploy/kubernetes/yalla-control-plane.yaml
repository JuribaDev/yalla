apiVersion: v1
kind: Namespace
metadata:
  name: yalla-control-plane
  labels:
    app.kubernetes.io/name: yalla-control-plane
    app.kubernetes.io/part-of: yalla
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: yalla-api
  namespace: yalla-control-plane
  labels:
    app.kubernetes.io/name: yalla-api
    app.kubernetes.io/part-of: yalla
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: yalla-worker
  namespace: yalla-control-plane
  labels:
    app.kubernetes.io/name: yalla-worker
    app.kubernetes.io/part-of: yalla
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yalla-control-plane-config
  namespace: yalla-control-plane
  labels:
    app.kubernetes.io/name: yalla-control-plane
    app.kubernetes.io/part-of: yalla
data:
  YALLA_PROFILE: production
  YALLA_API_ADDR: 0.0.0.0:8080
  YALLA_PUBLIC_URL: https://api.example.com
  YALLA_LOG_LEVEL: info
  YALLA_HTTP_READ_TIMEOUT: 15s
  YALLA_HTTP_WRITE_TIMEOUT: 60s
  YALLA_HTTP_IDLE_TIMEOUT: 120s
  # Replace with the ingress controller / reverse proxy pod CIDRs for your cluster.
  YALLA_TRUSTED_PROXY_CIDRS: 10.42.0.0/16
  YALLA_RATE_LIMIT_BACKEND: redis
  YALLA_RATE_LIMIT_REDIS_KEY_PREFIX: yalla:control-plane:ratelimit
  YALLA_RATE_LIMIT_REDIS_TIMEOUT: 250ms
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yalla-api
  namespace: yalla-control-plane
  labels:
    app.kubernetes.io/name: yalla-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: yalla
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: yalla-api
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yalla-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: yalla
    spec:
      serviceAccountName: yalla-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: yalla-api
          image: ghcr.io/juribadev/yalla-api:0.0.0-dev
          imagePullPolicy: Always
          command:
            - /usr/local/bin/yalla-api
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: YALLA_PROFILE
              valueFrom:
                configMapKeyRef:
                  name: yalla-control-plane-config
                  key: YALLA_PROFILE
            - name: YALLA_API_ADDR
              valueFrom:
                configMapKeyRef:
                  name: yalla-control-plane-config
                  key: YALLA_API_ADDR
            - name: YALLA_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: yalla-control-plane-config
                  key: YALLA_PUBLIC_URL
            - name: YALLA_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: yalla-control-plane-config
                  key: YALLA_LOG_LEVEL
            - name: YALLA_HTTP_READ_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: yalla-control-plane-config
                  key: YALLA_HTTP_READ_TIMEOUT
            - name: YALLA_HTTP_WRITE_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: yalla-control-plane-config
                  key: YALLA_HTTP_WRITE_TIMEOUT
            - name: YALLA_HTTP_IDLE_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: yalla-control-plane-config
                  key: YALLA_HTTP_IDLE_TIMEOUT
            - name: YALLA_TRUSTED_PROXY_CIDRS
              valueFrom:
                configMapKeyRef:
                  name: yalla-control-plane-config
                  key: YALLA_TRUSTED_PROXY_CIDRS
            - name: YALLA_RATE_LIMIT_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: yalla-control-plane-config
                  key: YALLA_RATE_LIMIT_BACKEND
            - name: YALLA_RATE_LIMIT_REDIS_KEY_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: yalla-control-plane-config
                  key: YALLA_RATE_LIMIT_REDIS_KEY_PREFIX
            - name: YALLA_RATE_LIMIT_REDIS_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: yalla-control-plane-config
                  key: YALLA_RATE_LIMIT_REDIS_TIMEOUT
            - name: YALLA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: yalla-control-plane-secrets
                  key: YALLA_DATABASE_URL
            - name: YALLA_SIGNING_KEYS
              valueFrom:
                secretKeyRef:
                  name: yalla-control-plane-secrets
                  key: YALLA_SIGNING_KEYS
            - name: YALLA_SECRET_KEYS
              valueFrom:
                secretKeyRef:
                  name: yalla-control-plane-secrets
                  key: YALLA_SECRET_KEYS
            - name: YALLA_DOKPLOY_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: yalla-control-plane-secrets
                  key: YALLA_DOKPLOY_BASE_URL
            - name: YALLA_DOKPLOY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: yalla-control-plane-secrets
                  key: YALLA_DOKPLOY_TOKEN
            - name: YALLA_INTERNAL_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: yalla-control-plane-secrets
                  key: YALLA_INTERNAL_WORKER_TOKEN
            - name: YALLA_RATE_LIMIT_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: yalla-control-plane-secrets
                  key: YALLA_RATE_LIMIT_REDIS_URL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
