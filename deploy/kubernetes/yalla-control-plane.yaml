---
apiVersion: v1
kind: Service
metadata:
  name: yalla-api
  namespace: yalla-control-plane
  labels:
    app.kubernetes.io/name: yalla-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: yalla
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: yalla-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: yalla-api
  namespace: yalla-control-plane
  labels:
    app.kubernetes.io/name: yalla-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: yalla
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yalla-api
      app.kubernetes.io/component: api
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yalla-control-plane-default-deny-ingress
  namespace: yalla-control-plane
  labels:
    app.kubernetes.io/name: yalla-control-plane
    app.kubernetes.io/part-of: yalla
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yalla-api-ingress
  namespace: yalla-control-plane
  labels:
    app.kubernetes.io/name: yalla-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: yalla
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: yalla-api
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: yalla-worker
              app.kubernetes.io/component: worker
      ports:
        - port: http
          protocol: TCP
